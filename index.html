<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무 프로그램</title>
  <style>
    :root{--bg:#f6f7f3;--panel:#fff;--ink:#1c2321;--muted:#66736d;--line:#dfe5df;--green:#197a55;--shadow:0 12px 28px rgba(28,35,33,.08)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif} main{width:min(960px,calc(100% - 32px));margin:0 auto;padding:44px 0} header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px} h1{margin:0 0 6px;font-size:clamp(30px,5vw,48px);line-height:1.05} p{margin:0;color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{display:block;min-height:170px;padding:22px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:inherit;text-decoration:none;box-shadow:var(--shadow)}.card:hover{border-color:var(--green)}.card strong{display:block;margin-bottom:10px;font-size:26px}.card span{display:block;color:var(--muted);line-height:1.55}.btn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}@media(max-width:720px){header{flex-direction:column;align-items:stretch}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>업무 프로그램</h1><p>사용할 프로그램을 선택하세요.</p></div>
      <a class="btn" href="/api/logout">로그아웃</a>
    </header>
    <section class="grid">
      <a class="card" href="/cashflow.html"><strong>입출금내역</strong><span>계좌와 카드 엑셀을 올려 사업자별, 월별, 기간별로 흐름을 봅니다.</span></a>
      <a class="card" href="/order.html"><strong>발주프로그램</strong><span>쿠팡 재고와 판매량 기준으로 추천 발주량을 계산합니다.</span></a>
      <a class="card" href="/dongdaemun.html"><strong>동대문사입</strong><span>거래처, 제품명, 원가, 판매가, 마진률을 계산합니다.</span></a>
    </section>
  </main>
</body>
</html>
