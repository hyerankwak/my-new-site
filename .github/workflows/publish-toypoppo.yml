name: Publish stored ToyPoppo articles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-toypoppo.yml']
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the stored queue without publishing
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency:
  group: toypoppo-cloud-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate publisher
        run: node --test scripts/publish-toypoppo-github.test.mjs
      - name: Select one due stored article
        id: due
        env:
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/publish-toypoppo-github.mjs --dry-run
          else
            node scripts/publish-toypoppo-github.mjs
          fi
      - name: Validate site
        if: steps.due.outputs.changed == 'true'
        run: node scripts/validate-toypoppo-deploy.cjs
      - name: Save publication record
        if: steps.due.outputs.changed == 'true'
        run: |
          git config user.name 'ToyPoppo Publisher'
          git config user.email 'toypoppo-publisher@users.noreply.github.com'
          git add .publication/queue.json data/toypoppo-publication-status.json blog sitemap.xml
          if ! git diff --cached --quiet; then git commit -m 'Publish due stored ToyPoppo article'; git push origin HEAD:gh-pages; fi
      - name: Resolve site revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy from the permitted Pages branch and wait
        if: steps.due.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          SITE_SHA: ${{ steps.revision.outputs.sha }}
        with:
          script: |
            const started = Date.now() - 120000;
            await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'pages.yml', ref: 'gh-pages'});
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 10000));
              const {data} = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id: 'pages.yml', branch: 'gh-pages', event: 'workflow_dispatch', per_page: 10});
              const run = data.workflow_runs.find(r => r.head_sha === process.env.SITE_SHA && Date.parse(r.created_at) >= started);
              if (!run) continue;
              core.info(`Pages deployment: ${run.html_url} (${run.status})`);
              if (run.status !== 'completed') continue;
              if (run.conclusion !== 'success') throw new Error(`Pages deployment ${run.conclusion}: ${run.html_url}`);
              return;
            }
            throw new Error('Pages deployment did not complete within the verification window');
      - name: Verify live page and save verified status
        if: steps.due.outputs.changed == 'true'
        run: |
          node scripts/publish-toypoppo-github.mjs --verify
          git add .publication/queue.json data/toypoppo-publication-status.json
          if ! git diff --cached --quiet; then git commit -m 'Verify ToyPoppo publication URL'; git push origin HEAD:gh-pages; fi
      - name: Publication summary
        if: always()
        run: |
          echo '## ToyPoppo GitHub publisher' >> "$GITHUB_STEP_SUMMARY"
          node scripts/publish-toypoppo-github.mjs --dry-run >> "$GITHUB_STEP_SUMMARY"
