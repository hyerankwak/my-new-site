name: Publish stored Wedding Guide articles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-wedding.yml']
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check stored drafts without publishing
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: wedding-guide-cloud-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wedding-guide
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all stored drafts
        run: node scripts/publish-wedding-github.cjs --check
      - name: Confirm deploy authorization
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
      - name: Select one due stored article
        id: due
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: node scripts/publish-wedding-github.cjs
      - name: Save prepared draft state for retry
        if: steps.due.outputs.changed == 'true'
        run: |
          git config user.name 'Wedding Guide Publisher'
          git config user.email 'wedding-guide@users.noreply.github.com'
          git add .publication index.html magazine sitemap.xml rss.xml feed.xml data/wedding-publication-status.json reports/wedding-github-publication.html
          if ! git diff --cached --quiet; then git commit -m 'Prepare due Wedding Guide article'; git push origin HEAD:wedding-guide; fi
      - name: Stage public site
        run: node scripts/stage-wedding-github.cjs
      - name: Deploy to Wedding Guide Cloudflare project
        if: steps.due.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _site --project-name=my-new-site-pages --branch=main
      - name: Verify actual public article
        if: steps.due.outputs.changed == 'true'
        run: |
          node scripts/publish-wedding-github.cjs --verify
          git add .publication data/wedding-publication-status.json reports/wedding-github-publication.html
          if ! git diff --cached --quiet; then git commit -m 'Verify deployed Wedding Guide article'; git push origin HEAD:wedding-guide; fi
      - name: Save daily status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wedding-publication-${{ github.run_id }}
          path: |
            .publication/queue.json
            data/wedding-publication-status.json
            reports/wedding-github-publication.html
          retention-days: 30
      - name: Update public verification report
        if: steps.due.outputs.changed == 'true' && success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/stage-wedding-github.cjs
          npx --yes wrangler@4 pages deploy _site --project-name=my-new-site-pages --branch=main
