<!doctype html><html lang="ko-KR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>사이트 소개 | 웨딩박람회 일정가이드</title><meta name="description" content="웨딩박람회 일정가이드는 전국 웨딩박람회 일정과 결혼준비 정보를 정리하는 정보 제공 사이트입니다."><link rel="canonical" href="https://wedding-guide.co.kr/about.html"><style>body{margin:0;background:#fffaf7;color:#342b2d;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.7}.wrap{width:min(880px,calc(100% - 36px));margin:60px auto}.nav{padding:18px 24px;border-bottom:1px solid #eadde1}.nav a{font-weight:800;color:#a93556;text-decoration:none}h1{font-size:40px;line-height:1.2}.box{padding:24px;background:#fff;border:1px solid #eadde1;border-radius:8px}</style></head><body><div class="nav"><a href="/">웨딩박람회 일정가이드</a></div><main class="wrap"><h1>사이트 소개</h1><div class="box"><p>웨딩박람회 일정가이드는 예비부부가 지역별 웨딩박람회 일정, 개최 장소, 상담 항목, 사전 신청 정보를 쉽게 비교할 수 있도록 정리하는 정보 제공 사이트입니다.</p><p>일부 링크는 제휴 링크이며, 신청 또는 상담 조건 충족 시 운영자가 수수료를 받을 수 있습니다. 제휴 여부와 관계없이 사용자가 실제로 확인해야 할 정보와 비교 기준을 함께 제공하는 것을 원칙으로 합니다.</p></div></main></body></html>
