<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>콘텐츠 발행 계획 | 토이포포</title><meta name="description" content="토이포포의 몬테소리, 발달놀이, 유아식, 초등학습 콘텐츠 발행 계획입니다."><style>body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2d2630;background:#fff7fb}main{width:min(980px,calc(100% - 36px));margin:48px auto;padding:34px;background:#fff;border:1px solid #eadde4;border-radius:8px}a{color:#b71f5b;font-weight:800}p,li{color:#746b73;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.box{padding:16px;border:1px solid #eadde4;border-radius:8px;background:#fffafc}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><p><a href="./">토이포포 홈</a></p><h1>콘텐츠 발행 계획</h1><p>토이포포는 애드센스 승인과 검색 유입 확대를 위해 영유아, 유아, 초등 주제를 꾸준히 확장합니다.</p><div class="grid"><div class="box"><h2>영유아</h2><p>월령별 장난감, 발달놀이, 몬테소리, 감각놀이, 유아식.</p></div><div class="box"><h2>유아</h2><p>촉감놀이, 한글놀이, 숫자놀이, 생활 습관, 장난감 정리.</p></div><div class="box"><h2>초등</h2><p>학년별 준비물, 문해력, 공부 루틴, 정리 습관, 독서.</p></div><div class="box"><h2>운영 원칙</h2><p>얇은 상품 글보다 검색 의도에 답하는 정보 글을 우선 발행합니다.</p></div></div></main></body></html>
