<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>6~12개월 아기 발달에 좋은 놀이 | 토이포포</title><meta name="description" content="6개월부터 12개월까지 아기 발달 흐름에 맞춘 놀이 방법을 정리했습니다."><style>body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2d2630;background:#fff7fb}article{width:min(860px,calc(100% - 36px));margin:48px auto;padding:34px;background:#fff;border:1px solid #eadde4;border-radius:8px}a{color:#b71f5b;font-weight:800}p,li{color:#746b73;line-height:1.85}</style></head><body><article><p><a href="./">블로그</a> / 발달놀이</p><h1>6~12개월 아기 발달에 좋은 놀이</h1><p>이 시기의 놀이는 많이 가르치는 것이 아니라 아기가 손, 입, 눈, 몸을 쓰며 스스로 탐색할 수 있게 돕는 것이 핵심입니다.</p><h2>6~7개월</h2><p>헝겊책 만지기, 치발기 잡기, 터미타임 거울 보기처럼 감각 탐색과 시선 추적 놀이가 좋습니다.</p><h2>8~10개월</h2><p>딸랑이 흔들기, 공 굴리기, 버튼 누르기, 컵쌓기처럼 원인과 결과가 분명한 놀이가 잘 맞습니다.</p><h2>11~12개월</h2><p>블록 넣고 빼기, 악기 두드리기, 간단한 흉내 놀이로 손과 눈의 협응을 도와주세요.</p></article></body></html>
