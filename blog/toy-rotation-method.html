<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>장난감 로테이션 방법 | 토이포포</title><meta name="description" content="장난감을 많이 사지 않고도 아이가 더 오래 집중하게 돕는 장난감 로테이션 방법을 정리했습니다."><style>body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2d2630;background:#fff7fb}article{width:min(860px,calc(100% - 36px));margin:48px auto;padding:34px;background:#fff;border:1px solid #eadde4;border-radius:8px}a{color:#b71f5b;font-weight:800}p,li{color:#746b73;line-height:1.85}</style></head><body><article><p><a href="./">블로그</a> / 장난감 정리</p><h1>장난감 로테이션 방법</h1><p>장난감은 많을수록 좋은 것이 아니라 아이가 집중해서 선택할 수 있을 만큼만 꺼내두는 편이 좋습니다.</p><h2>기본 방법</h2><ul><li>한 번에 3~5개만 꺼내둡니다.</li><li>감각, 움직임, 책, 조작 장난감을 섞습니다.</li><li>일주일 단위로 일부만 바꿉니다.</li><li>아이가 반복해서 찾는 장난감은 조금 더 오래 둡니다.</li></ul><p>로테이션은 새 장난감을 계속 사지 않아도 기존 장난감의 관심도를 되살리는 데 도움이 됩니다.</p></article></body></html>
