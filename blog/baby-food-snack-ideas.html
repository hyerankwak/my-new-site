<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>아기 간식과 유아식 준비 팁 | 토이포포</title><meta name="description" content="아기 간식, 유아식, 자기주도 식사 준비 시 확인할 점과 식사 도구 선택 기준을 정리했습니다."><style>body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2d2630;background:#fff7fb}article{width:min(860px,calc(100% - 36px));margin:48px auto;padding:34px;background:#fff;border:1px solid #eadde4;border-radius:8px}a{color:#b71f5b;font-weight:800}p,li{color:#746b73;line-height:1.85}.notice{padding:14px;background:#fff5d9;border:1px solid #ffd27b;border-radius:8px}</style></head><body><article><p><a href="./">블로그</a> / 유아식</p><h1>아기 간식과 유아식 준비 팁</h1><p>유아식과 간식은 맛보다 안전한 크기, 질감, 알레르기 반응 확인이 먼저입니다.</p><h2>준비 기준</h2><ul><li>처음 먹는 식재료는 소량으로 시작합니다.</li><li>질식 위험이 있는 둥글고 단단한 음식은 모양을 조절합니다.</li><li>식사 도구는 미끄럼 방지, 세척 편의성, 손잡이 크기를 봅니다.</li><li>간식은 식사 대체가 아니라 식사 사이 보조로 봅니다.</li></ul><p class="notice">아이의 알레르기, 질환, 성장 상태에 따라 식사 기준은 달라질 수 있으므로 필요 시 전문가와 상담하세요.</p></article></body></html>
