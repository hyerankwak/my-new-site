<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>초등학생 공부 루틴 만들기 | 토이포포</title><meta name="description" content="초등학생 공부 루틴, 플래너, 오답노트, 시간 관리 습관을 만드는 방법을 정리했습니다."><style>body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2d2630;background:#fff7fb}article{width:min(860px,calc(100% - 36px));margin:48px auto;padding:34px;background:#fff;border:1px solid #eadde4;border-radius:8px}a{color:#b71f5b;font-weight:800}p,li{color:#746b73;line-height:1.85}</style></head><body><article><p><a href="./">블로그</a> / 초등루틴</p><h1>초등학생 공부 루틴 만들기</h1><p>초등 공부 루틴은 오래 앉히는 것보다 시작 시간을 정하고, 할 일을 작게 나누고, 끝낸 것을 확인하는 구조가 중요합니다.</p><h2>기본 구조</h2><ul><li>매일 같은 시간에 15~30분부터 시작합니다.</li><li>오늘 할 일을 2~3개만 적습니다.</li><li>틀린 문제는 바로 다시 풀기보다 이유를 한 줄로 남깁니다.</li><li>주말에는 밀린 공부보다 정리와 복습을 우선합니다.</li></ul><p>플래너와 타이머는 아이를 감시하는 도구가 아니라 스스로 시간을 보는 연습 도구로 사용해야 합니다.</p></article></body></html>
