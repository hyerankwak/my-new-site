<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>초등 문해력과 독서 습관 | 토이포포</title><meta name="description" content="초등학생 문해력과 독서 습관을 만드는 방법, 독서 기록과 책 고르는 기준을 정리했습니다."><style>body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2d2630;background:#fff7fb}article{width:min(860px,calc(100% - 36px));margin:48px auto;padding:34px;background:#fff;border:1px solid #eadde4;border-radius:8px}a{color:#b71f5b;font-weight:800}p,li{color:#746b73;line-height:1.85}</style></head><body><article><p><a href="./">블로그</a> / 초등문해력</p><h1>초등 문해력과 독서 습관</h1><p>초등 문해력은 어려운 책을 많이 읽히는 것보다 아이가 이해하고 말로 설명할 수 있는 독서 경험을 쌓는 데서 시작합니다.</p><h2>독서 루틴</h2><ul><li>하루 10분이라도 같은 시간에 읽습니다.</li><li>줄거리보다 인상 깊은 장면을 말하게 합니다.</li><li>모르는 단어는 바로 시험 보듯 묻지 않고 문장 안에서 다시 봅니다.</li><li>독서 기록은 한 줄부터 시작합니다.</li></ul><p>저학년은 재미와 반복, 고학년은 다양한 주제와 요약 습관이 중요합니다.</p></article></body></html>
