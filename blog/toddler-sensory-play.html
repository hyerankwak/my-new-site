<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>유아 촉감놀이 아이디어 | 토이포포</title><meta name="description" content="유아가 집에서 안전하게 해볼 수 있는 촉감놀이 아이디어와 준비 기준을 정리했습니다."><style>body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2d2630;background:#fff7fb}article{width:min(860px,calc(100% - 36px));margin:48px auto;padding:34px;background:#fff;border:1px solid #eadde4;border-radius:8px}a{color:#b71f5b;font-weight:800}p,li{color:#746b73;line-height:1.85}</style></head><body><article><p><a href="./">블로그</a> / 유아놀이</p><h1>유아 촉감놀이 아이디어</h1><p>유아 촉감놀이는 손으로 만지고 비교하고 옮기는 과정에서 감각과 언어를 함께 확장하는 활동입니다.</p><h2>집에서 쉬운 놀이</h2><ul><li>쌀이나 파스타 옮기기</li><li>물놀이 컵 따르기</li><li>부드러운 천과 거친 천 비교하기</li><li>스펀지 짜기와 물 흡수 관찰하기</li></ul><h2>안전 체크</h2><p>입에 넣을 수 있는 시기에는 작은 재료를 피하고 반드시 보호자가 옆에서 지켜봐야 합니다.</p></article></body></html>
